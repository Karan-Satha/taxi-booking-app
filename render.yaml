services:
  - type: web
    name: heathrow-drive-api-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix apps/api && npm run build:api
    startCommand: npm run db:migrate --prefix apps/api && npm start --prefix apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: WEB_ORIGIN
        value: https://heathrow-drive-web-demo.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: PG_SSL
        value: 'true'
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: 'true'

  - type: web
    name: heathrow-drive-web-demo
    runtime: static
    buildCommand: npm ci --prefix apps/web && npm run build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://heathrow-drive-api-demo.onrender.com
